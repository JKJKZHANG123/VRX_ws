bt_navigator:
  ros__parameters:
    use_sim_time: true
    # No EKF/GPS chain: Point-LIO is the sole odometry source. camera_init IS
    # the world/map frame, /aft_mapped_to_init carries pose + twist directly.
    global_frame: camera_init
    robot_base_frame: wamv/wamv/base_link
    odom_topic: /aft_mapped_to_init
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: false
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    # 自定义 BT: 0.25 Hz 有界重规划，并在规划失败时先恢复再进入控制器。
    # 差速船禁止原地转 (use_rotate_to_heading:false) 与倒退 (allow_reversing:false),
    # 也不使用 Spin/BackUp 恢复；规划失败时只清代价地图、等待并安全退出。
    # 绝对路径由 navigation.launch.py 通过 bt_actual 覆盖此处值 (无 RewrittenYaml)。
    default_nav_to_pose_bt_xml: "PACKAGE_SHARE/usv_nav_to_pose.xml"

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true
    default_nav_through_poses_bt_xml: "PACKAGE_SHARE/usv_nav_to_pose.xml"

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 8.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # A 2 m tolerance made a 4 m test report success at x≈2.1 m.
      # Require the boat centre to reach within 0.8 m of the requested point.
      xy_goal_tolerance: 0.8
      yaw_goal_tolerance: 0.5

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # ── 核心巡航速度 (你要的“开多快”就调这一个) ──────────────
      # 2.5 -> 1.0: 差速船惯性大, 2.5m/s 时转弯半径远超 Dubin 规划假设 (2.5m),
      # 是"打圈/冲岸"的直接原因之一。1.0m/s 让实际轨迹贴合规划线。
      desired_linear_vel: 0.6           # m/s 目标巡航速度
      min_approach_linear_velocity: 0.2   # 接近目标时的最低速度
      approach_velocity_scaling_dist: 6.0 # 距目标多远开始减速

      # ── 前视距离 (RPP 的“朝多远的点开”) ──────────────────────
      lookahead_dist: 3.0              # 基础前视距离 (m)
      min_lookahead_dist: 2.0
      max_lookahead_dist: 5.0
      lookahead_time: 1.5              # 速度越快前视越远 (vel × time)
      use_velocity_scaled_lookahead_dist: true

      # ── 转向行为 (差动船: 不原地转、不倒退, 匹配 Dubin 规划) ──
      use_rotate_to_heading: false
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_interpolation: true
      transform_tolerance: 0.2

      # ── 弯道限速 (转弯时自动减速, 防止甩尾) ──────────────────
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 6.0   # 转弯半径小于此值就减速
      regulated_linear_scaling_min_speed: 0.2

      # ── 避障限速 (靠近障碍自动减速 + 碰撞预测) ───────────────
      use_cost_regulated_linear_velocity_scaling: true
      inflation_cost_scaling_factor: 3.0   # 需与 costmap inflation 一致
      cost_scaling_dist: 3.0
      cost_scaling_gain: 1.0
      use_collision_detection: true
      # Check imminent collision, not the entire long detour.  The direct
      # LiDAR gate remains the hard stop while RPP is allowed to steer around
      # a replanned obstacle.
      max_allowed_time_to_collision_up_to_carrot: 1.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: camera_init
      robot_base_frame: wamv/wamv/base_link
      use_sim_time: true
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.3
      footprint: "[[2.6, 1.3], [2.6, -1.3], [-2.5, -1.3], [-2.5, 1.3]]"
      # Use the current, body-frame scan only.  The registered cloud is an
      # accumulated LIO map and feeding it to a rolling costmap repaints old
      # returns around the boat.  The plain obstacle layer is intentional:
      # unlike STVL it does not retain a voxel after the current scan clears it.
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        combination_method: 1
        observation_sources: lidar_cloud dynamic_cloud
        transform_tolerance: 0.3

        lidar_cloud:
          data_type: "PointCloud2"
          topic: /usv/raw_obstacle_cloud
          marking: true
          clearing: true
          obstacle_max_range: 25.0
          raytrace_max_range: 30.0
          min_obstacle_height: 0.50
          max_obstacle_height: 3.0
          expected_update_rate: 2.0
          observation_persistence: 0.0
          inf_is_valid: false
          clear_after_reading: true

        # The tracker publishes short-horizon predicted returns in the boat
        # frame.  Keep the raw scan as the authoritative source for static
        # structure and emergency clearing; this second source adds the
        # dynamic prediction without replacing ordinary LiDAR avoidance.
        dynamic_cloud:
          data_type: "PointCloud2"
          topic: /usv/dynamic_obstacle_cloud
          marking: true
          clearing: true
          obstacle_max_range: 35.0
          raytrace_max_range: 35.0
          min_obstacle_height: 0.50
          max_obstacle_height: 3.0
          expected_update_rate: 2.0
          observation_persistence: 0.0
          inf_is_valid: false
          clear_after_reading: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # The footprint already models the 5.1 x 2.6 m hull.  Keep only a
        # small extra buffer so a real return 5.5 m away cannot overlap it.
        inflation_radius: 1.5

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: camera_init
      robot_base_frame: wamv/wamv/base_link
      use_sim_time: true
      footprint: "[[2.6, 1.3], [2.6, -1.3], [-2.5, -1.3], [-2.5, 1.3]]"
      resolution: 0.5
      rolling_window: true
      width: 100
      height: 100
      track_unknown_space: true
      # Use the same live body-frame scan for both maps.  This prevents a
      # startup snapshot or persistent LIO map from becoming a large global
      # ring.  A rolling global map is refreshed and ray-cleared on every scan.
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        combination_method: 1
        observation_sources: lidar_cloud dynamic_cloud
        transform_tolerance: 0.3

        lidar_cloud:
          data_type: "PointCloud2"
          topic: /usv/raw_obstacle_cloud
          marking: true
          clearing: true
          obstacle_max_range: 25.0
          raytrace_max_range: 30.0
          min_obstacle_height: 0.50
          max_obstacle_height: 3.0
          expected_update_rate: 2.0
          observation_persistence: 0.0
          inf_is_valid: false
          clear_after_reading: true

        dynamic_cloud:
          data_type: "PointCloud2"
          topic: /usv/dynamic_obstacle_cloud
          marking: true
          clearing: true
          obstacle_max_range: 35.0
          raytrace_max_range: 35.0
          min_obstacle_height: 0.50
          max_obstacle_height: 3.0
          expected_update_rate: 2.0
          observation_persistence: 0.0
          inf_is_valid: false
          clear_after_reading: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 1.5

      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: true
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 2.0
      # 在线滚动地图的未观测区不能阻塞起点；实际点云障碍仍不可穿越。
      allow_unknown: true
      # Bound each search so a stale plan cannot block the BT/controller.
      max_iterations: 300000
      max_planning_time: 2.0
      motion_model_for_search: "DUBIN"
      # 36 bins are adequate for a slow surface vessel and halve search cost.
      angle_quantization_bins: 36
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 20.0
      minimum_turning_radius: 2.5
      reverse_penalty: 2.0
      change_penalty: 0.2
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # 差动船不允许倒退 (allow_reversing: false), back_up 恢复会卡死。只留
    # spin(原地差动转向可用) + wait + replanning。
    behavior_plugins: ["spin", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: camera_init
    robot_base_frame: wamv/wamv/base_link
    transform_tolerance: 0.5
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false

# NOTE: collision_monitor was removed from the launch + lifecycle list: under
# use_sim_time its pointcloud source stayed permanently stale (>5s timestamp
# skew) so it never forwarded cmd_vel and the boat froze. Shore avoidance is
# handled by the costmaps (min_obstacle_height now 0.50) + RPP collision
# detection (use_collision_detection: true above).

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [1.5, 0.0, 0.8]
    min_velocity: [-0.3, 0.0, -0.8]
    max_accel: [1.0, 0.0, 1.5]
    max_decel: [-1.0, 0.0, -1.5]
    odom_topic: "/aft_mapped_to_init"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ['controller_server', 'planner_server', 'behavior_server', 'bt_navigator', 'velocity_smoother', 'smoother_server']
